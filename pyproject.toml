[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-in-chrome"
dynamic = ["version"]
description = "Let Gemini (or any MCP agent) use your real Chrome: a new background tab, a visible cursor and glow, no extension."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "gemini", "chrome", "browser-automation", "agent", "playwright", "antigravity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "playwright>=1.45",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gemini-in-chrome = "gemini_in_chrome.cli:main"

[tool.hatch.version]
path = "src/gemini_in_chrome/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_in_chrome"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
